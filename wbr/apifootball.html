<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e19"><title>WBR · API-Football Test</title><style>
:root{color-scheme:dark}body{margin:0;background:#080e19;color:#eef4ff;font:15px/1.5 system-ui,Arial}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#101a2b;border:1px solid #243550;border-radius:14px;padding:16px;margin:14px 0}h1{font-size:21px}label{display:block;margin:12px 0 5px;color:#91a4c2}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #344a68;background:#0b1524;color:#eef4ff;width:100%;box-sizing:border-box}button{background:#36d6cf;color:#04161c;font-weight:750;border:0;margin-top:12px}.muted{color:#91a4c2}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#050a12;padding:12px;border-radius:9px;font-size:12px}.ok{color:#a6e36b}.err{color:#ff737b}
</style></head><body><main class="wrap"><h1>WBR · API-Football Verbindungstest</h1><p class="muted">Der API-Football-Key bleibt serverseitig in Render. Hier wird nur dein WBR_SYNC_TOKEN für den geschützten Test verwendet.</p>
<section class="card"><label for="token">WBR_SYNC_TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="Dein Render-Sync-Token">
<label for="mode">Abruf auswählen</label><select id="mode"><option value="status">Account / API-Key Status (kein Tageskontingent)</option><option value="date">Fixtures für heute</option><option value="live">Alle aktuell live gemeldeten Spiele</option></select>
<button id="run">API-Football testen</button><p class="muted" id="status">Noch kein Test ausgeführt.</p></section>
<section class="card"><h2>Ergebnis</h2><pre id="result">Noch keine Daten.</pre></section></main>
<script>
const $=id=>document.getElementById(id);
$('run').onclick=async()=>{const token=$('token').value.trim();if(!token){$('status').textContent='Bitte WBR_SYNC_TOKEN eingeben.';return;}$('run').disabled=true;$('status').textContent='API-Football wird abgefragt …';try{const r=await fetch('https://wbr-backend-4l4n.onrender.com/api/v1/apifootball/sync',{method:'POST',headers:{'Content-Type':'application/json','X-WBR-Sync-Token':token},body:JSON.stringify({mode:$('mode').value})});const d=await r.json();if(!r.ok)throw new Error(JSON.stringify(d));$('status').innerHTML='<span class="ok">Erfolgreiche Antwort von API-Football.</span>';$('result').textContent=JSON.stringify(d,null,2)}catch(e){$('status').innerHTML='<span class="err">'+e.message+'</span>'}finally{$('run').disabled=false}};
</script></body></html>
